<svg viewBox="0 0 840 392" width="840" height="392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal apresentando Welisson Henrique, Full Stack and Mobile Developer">
  <title>Welisson Henrique, Full Stack &amp; Mobile Developer</title>
  <desc>Terminal animado que digita: whoami, stack --list e focus --now.</desc>

  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.0" r="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#7c3aed" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="c1"><rect x="26" y="78"  width="0" height="26"><animate attributeName="width" from="0" to="130" begin="0.20s" dur="0.45s" calcMode="spline" keySplines="0.2 0.6 0.2 1" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="26" y="110" width="0" height="26"><animate attributeName="width" from="0" to="660" begin="0.75s" dur="0.60s" calcMode="spline" keySplines="0.2 0.6 0.2 1" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="26" y="154" width="0" height="26"><animate attributeName="width" from="0" to="210" begin="1.50s" dur="0.45s" calcMode="spline" keySplines="0.2 0.6 0.2 1" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="26" y="186" width="0" height="26"><animate attributeName="width" from="0" to="600" begin="2.05s" dur="0.55s" calcMode="spline" keySplines="0.2 0.6 0.2 1" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="26" y="216" width="0" height="26"><animate attributeName="width" from="0" to="560" begin="2.65s" dur="0.55s" calcMode="spline" keySplines="0.2 0.6 0.2 1" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="26" y="260" width="0" height="26"><animate attributeName="width" from="0" to="190" begin="3.35s" dur="0.45s" calcMode="spline" keySplines="0.2 0.6 0.2 1" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="26" y="292" width="0" height="26"><animate attributeName="width" from="0" to="600" begin="3.90s" dur="0.55s" calcMode="spline" keySplines="0.2 0.6 0.2 1" fill="freeze"/></rect></clipPath>

    <style>
      text { font-family: 'JetBrains Mono','Fira Mono','SF Mono',ui-monospace,'DejaVu Sans Mono',monospace; font-size: 18px; }
      .prompt { fill:#22d3ee; font-weight:700; }
      .key    { fill:#e6edf3; }
      .flag   { fill:#7d8590; }
      .out    { fill:#c9d1d9; }
      .muted  { fill:#6e7681; }
      .hex    { fill:#34d399; }
      .arrow  { fill:#e879f9; }
      .at     { fill:#f0a35e; }
      .nm     { fill:url(#name); font-weight:700; }
      .title  { fill:#6e7681; font-size:14px; letter-spacing:0.5px; }
    </style>
  </defs>

  <!-- window -->
  <rect x="6" y="6" width="828" height="380" rx="14" fill="#0d1117" stroke="url(#border)" stroke-width="1.5"/>
  <rect x="6" y="6" width="828" height="380" rx="14" fill="url(#glow)"/>

  <!-- title bar -->
  <path d="M20,6 H820 a14,14 0 0 1 14,14 V52 H6 V20 a14,14 0 0 1 14,-14 Z" fill="#12161d"/>
  <line x1="6" y1="52" x2="834" y2="52" stroke="#21262d" stroke-width="1"/>
  <circle cx="32" cy="29" r="6.5" fill="#ff5f57"/>
  <circle cx="54" cy="29" r="6.5" fill="#febc2e"/>
  <circle cx="76" cy="29" r="6.5" fill="#28c840"/>
  <text class="title" x="420" y="34" text-anchor="middle">welisson · zsh</text>

  <!-- body -->
  <text x="30" y="96"  clip-path="url(#c1)"><tspan class="prompt">❯</tspan><tspan class="key"> whoami</tspan></text>
  <text x="30" y="128" clip-path="url(#c2)"><tspan class="nm">welisson henrique</tspan><tspan class="out"> · full stack &amp; mobile developer</tspan><tspan class="muted"> · 4y</tspan></text>

  <text x="30" y="172" clip-path="url(#c3)"><tspan class="prompt">❯</tspan><tspan class="key"> stack</tspan><tspan class="flag"> --list</tspan></text>
  <text x="30" y="204" clip-path="url(#c4)"><tspan class="hex">⬡</tspan><tspan class="out"> react native  </tspan><tspan class="hex">⬡</tspan><tspan class="out"> expo  </tspan><tspan class="hex">⬡</tspan><tspan class="out"> node  </tspan><tspan class="hex">⬡</tspan><tspan class="out"> go  </tspan><tspan class="hex">⬡</tspan><tspan class="out"> .net</tspan></text>
  <text x="30" y="234" clip-path="url(#c5)"><tspan class="hex">⬡</tspan><tspan class="out"> aws  </tspan><tspan class="hex">⬡</tspan><tspan class="out"> mongodb  </tspan><tspan class="hex">⬡</tspan><tspan class="out"> docker  </tspan><tspan class="hex">⬡</tspan><tspan class="out"> typescript</tspan></text>

  <text x="30" y="278" clip-path="url(#c6)"><tspan class="prompt">❯</tspan><tspan class="key"> focus</tspan><tspan class="flag"> --now</tspan></text>
  <text x="30" y="310" clip-path="url(#c7)"><tspan class="arrow">▸</tspan><tspan class="out"> building offline-first mobile apps </tspan><tspan class="at">@</tspan><tspan class="out"> softcenter</tspan></text>

  <!-- final prompt + blinking cursor -->
  <text x="30" y="354"><tspan class="prompt">❯</tspan></text>
  <rect x="48" y="338" width="11" height="20" rx="2" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="4.55s" repeatCount="indefinite"/>
  </rect>
</svg>
